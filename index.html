- { margin: 0; padding: 0; box-sizing: border-box; }

body {

color: var(–text);

left: -50%;

height: 200%;

z-index: 0;
}

@keyframes bgpulse {
0% { transform: scale(1) rotate(0deg); }
100% { transform: scale(1.1) rotate(3deg); }
}

.container {

margin: 0 auto;

/* HEADER */

font-size: 11px;
letter-spacing: 3px;
text-transform: uppercase;
padding: 6px 16px;
border-radius: 20px;
margin-bottom: 16px;
}

.header h1 {

font-size: clamp(28px, 5vw, 48px);
font-weight: 800;

-webkit-text-fill-color: transparent;

}

.header p {
color: var(–text-muted);
font-size: 13px;
letter-spacing: 1px;
}

/* PROGRESS BAR */

flex-wrap: wrap;
}

.progress-stats {
display: flex;
gap: 24px;
flex-wrap: wrap;
}

.stat {
text-align: center;
}

.stat-num {
font-family: ‘Syne’, sans-serif;
font-size: 28px;
font-weight: 800;

.stat-num.done-stat { color: var(–done); }
.stat-num.day-stat { color: var(–accent2); }

.stat-label {
font-size: 10px;
color: var(–text-muted);
letter-spacing: 2px;
text-transform: uppercase;
margin-top: 4px;
}

.progress-bar-wrap {
flex: 1;
min-width: 200px;
}

.progress-bar-label {
display: flex;
justify-content: space-between;
font-size: 11px;
color: var(–text-muted);
margin-bottom: 8px;
}

.progress-bar-bg {
background: var(–border);
border-radius: 999px;
height: 8px;
overflow: hidden;
}

.progress-bar-fill {
height: 100%;
border-radius: 999px;
background: linear-gradient(90deg, var(–accent), var(–accent2));
transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
width: 0%;
}

/* RESET BUTTON */
.reset-btn {
background: rgba(255,101,132,0.1);
border: 1px solid rgba(255,101,132,0.3);
color: var(–accent2);
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 1px;
padding: 8px 16px;
border-radius: 8px;
cursor: pointer;
transition: all 0.2s;
}

.reset-btn:hover {
background: rgba(255,101,132,0.2);
border-color: var(–accent2);
}

.day-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 16px;
margin-bottom: 16px;
overflow: hidden;

}

.day-card.all-done {
border-color: rgba(67,233,123,0.4);

.day-header {
display: flex;
align-items: center;
padding: 16px 20px;
cursor: pointer;
user-select: none;
gap: 16px;
transition: background 0.2s;
}

.day-header:hover { background: var(–surface2); }

.day-number {
font-family: ‘Syne’, sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 3px;
text-transform: uppercase;
color: var(–text-muted);

}

.day-title {

font-size: 15px;
font-weight: 700;
color: var(–text);

}

.day-meta {

gap: 12px;
align-items: center;
flex-wrap: wrap;

.day-hours {

border-radius: 20px;

.day-progress-mini {
font-size: 11px;
color: var(–text-muted);

}

.day-progress-mini.complete {

.day-check-all {

height: 28px;
border-radius: 8px;
border: 2px solid var(–border);
background: transparent;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;

.day-check-all:hover {

.day-check-all.checked {

.chevron {

.day-card.open .chevron { transform: rotate(180deg); }

.day-card.open .video-list { display: block; }

.section-label {

.video-item:last-child { border-bottom: none; }

margin-top: 4px;

.video-duration {

.video-tag {

@keyframes confetti-fall {
0% { transform: translateY(0) rotate(0deg); opacity: 1; }

font-size: 24px;
font-weight: 800;

.streak-day {

.streak-dot {
width: 6px;
height: 6px;

background: var(–border);

@media (max-width: 600px) {

.day-title { font-size: 13px; }

</style>

const TOTAL = DAYS.reduce((a, d) => a + d.videos.length, 0);
let state = {};

function loadState() {
  const saved = localStorage.getItem('marrow_pedia_state');
  state = saved ? JSON.parse(saved) : {};
}

function saveState() {
  localStorage.setItem('marrow_pedia_state', JSON.stringify(state));
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  state = {};
  saveState();
  renderAll();
}

function toggleVideo(id) {
  state[id] = !state[id];
  saveState();
  renderAll();
  if (state[id]) spawnConfetti(3);
}

function toggleDay(dayIdx) {
  const day = DAYS[dayIdx];
  const allDone = day.videos.every(v => state[v.id]);
  day.videos.forEach(v => { state[v.id] = !allDone; });
  saveState();
  renderAll();
  if (!allDone) spawnConfetti(12);
}

function spawnConfetti(count) {
  const colors = ['#6c63ff','#ff6584','#43e97b','#ffc107','#00d4ff'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = Math.random() * 0.3 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 80);
  }
}

function getDoneCount() {
  return Object.values(state).filter(Boolean).length;
}

function renderStreak() {
  const bar = document.getElementById('streakBar');
  bar.innerHTML = DAYS.map((d, i) => {
    const allDone = d.videos.every(v => state[v.id]);
    return `<div class="streak-day ${allDone ? 'complete' : ''}">
      <div class="streak-day-num">${d.day}</div>
      <div class="streak-dot"></div>
    </div>`;
  }).join('');
}

function renderProgress() {
  const done = getDoneCount();
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = TOTAL;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';

  const daysComplete = DAYS.filter(d => d.videos.every(v => state[v.id])).length;
  document.getElementById('daysLeft').textContent = 15 - daysComplete;

  const banner = document.getElementById('completionBanner');
  if (done === TOTAL) {
    banner.classList.add('show');
    spawnConfetti(30);
  } else {
    banner.classList.remove('show');
  }
}

function renderDays() {
  const container = document.getElementById('daysContainer');
  const openDays = JSON.parse(localStorage.getItem('marrow_open_days') || '{"0":true}');

  container.innerHTML = DAYS.map((day, idx) => {
    const allDone = day.videos.every(v => state[v.id]);
    const doneCnt = day.videos.filter(v => state[v.id]).length;
    const isOpen = openDays[idx] !== false;

    const videoItems = day.videos.map(v => {
      const checked = !!state[v.id];
      const tagHtml = v.tags.map(t => {
        if (t === 'heavy') return `<span class="video-tag tag-heavy">heavy</span>`;
        if (t === 'high') return `<span class="video-tag tag-high">high yield</span>`;
        if (t === 'qbank') return `<span class="video-tag tag-qbank">qbank</span>`;
        return '';
      }).join('');

      return `<div class="video-item ${checked ? 'checked' : ''}" onclick="toggleVideo('${v.id}'); event.stopPropagation()">
        <div class="video-checkbox">${checked ? '✓' : ''}</div>
        <div class="video-info">
          <div class="video-name">${v.name}</div>
          <div class="video-tags">
            <span class="video-duration">${v.dur}</span>
            ${tagHtml}
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="day-card ${allDone ? 'all-done' : ''} ${isOpen ? 'open' : ''}" id="day-card-${idx}">
      <div class="day-header" onclick="toggleDayOpen(${idx})">
        <span class="day-number">Day ${day.day}</span>
        <span class="day-title">${day.title}</span>
        <div class="day-meta">
          <span class="day-hours">${day.hours}</span>
          <span class="day-progress-mini ${allDone ? 'complete' : ''}">${doneCnt}/${day.videos.length} ${allDone ? '✓' : ''}</span>
        </div>
        <div class="day-check-all ${allDone ? 'checked' : ''}" onclick="toggleDay(${idx}); event.stopPropagation()" title="Mark all done">
          ${allDone ? '✓' : ''}
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="video-list">
        <div class="section-label">Videos + Tasks</div>
        ${videoItems}
      </div>
    </div>`;
  }).join('');
}

function toggleDayOpen(idx) {
  const openDays = JSON.parse(localStorage.getItem('marrow_open_days') || '{"0":true}');
  openDays[idx] = !openDays[idx];
  localStorage.setItem('marrow_open_days', JSON.stringify(openDays));
  renderAll();
}

function renderAll() {
  renderProgress();
  renderStreak();
  renderDays();
}

loadState();
renderAll();
</script>

</body>
</html>
